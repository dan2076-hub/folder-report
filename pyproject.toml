[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-report"
version = "0.1.0"
description = "Read-only directory reports and verified duplicate discovery."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
folder-report = "folder_report.cli:main"

[tool.setuptools.packages.find]
include = ["folder_report*"]
